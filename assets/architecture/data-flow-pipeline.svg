<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-label="SAGE End-to-End Data Flow Pipeline">
  <defs>
    <style>
      .title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .sub { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .sec { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #0060AA; }
      .step-num { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .step-t { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .step-d { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .pill { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #166534; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#0060AA"/>
    </marker>
    <marker id="arrDark" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1E293B"/>
    </marker>
  </defs>

  <rect width="1160" height="520" fill="#FFFFFF"/>

  <text x="32" y="38" class="title">SAGE — Audio/Video Capture, Synchronization &amp; Recall Data Flow</text>
  <text x="32" y="58" class="sub">Step-by-step lifecycle from raw microcontroller streams to verified natural-language memory retrieval</text>
  <line x1="32" y1="72" x2="1128" y2="72" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- PIPELINE A: CAPTURE & INGESTION -->
  <text x="32" y="98" class="sec">1. CAPTURE, AVI MUXING &amp; CLOUD PRESERVATION PIPELINE (PROCESSING SERVICE)</text>

  <!-- Step 1 -->
  <rect x="32" y="114" width="142" height="128" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="56" cy="136" r="13" fill="#0060AA"/>
  <text x="56" y="140" text-anchor="middle" class="step-num">1</text>
  <text x="76" y="140" class="step-t">Dual Input</text>
  <text x="44" y="168" class="step-d">MJPEG (:80) +</text>
  <text x="44" y="184" class="step-d">16 kHz PCM (:81)</text>
  <text x="44" y="200" class="step-d">over Wi-Fi SoftAP</text>
  <text x="44" y="222" class="step-d" style="fill:#0369A1;">Native socket bind</text>

  <line x1="174" y1="178" x2="194" y2="178" stroke="#0060AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="198" y="114" width="142" height="128" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="222" cy="136" r="13" fill="#0060AA"/>
  <text x="222" y="140" text-anchor="middle" class="step-num">2</text>
  <text x="242" y="140" class="step-t">AVI Muxer</text>
  <text x="210" y="168" class="step-d">Interleaves 00dc</text>
  <text x="210" y="184" class="step-d">&amp; 01wb chunks,</text>
  <text x="210" y="200" class="step-d">rewrites header</text>
  <text x="210" y="222" class="step-d" style="fill:#0369A1;">&lt;40 ms A/V drift</text>

  <line x1="340" y1="178" x2="360" y2="178" stroke="#0060AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="364" y="114" width="142" height="128" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="388" cy="136" r="13" fill="#1E3A8A"/>
  <text x="388" y="140" text-anchor="middle" class="step-num">3</text>
  <text x="408" y="140" class="step-t">Local Cache</text>
  <text x="376" y="168" class="step-d">Staged safely in</text>
  <text x="376" y="184" class="step-d">/Download/SAGE</text>
  <text x="376" y="200" class="step-d">until network</text>
  <text x="376" y="222" class="step-d" style="fill:#1E3A8A;">Async queue ready</text>

  <line x1="506" y1="178" x2="526" y2="178" stroke="#0060AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="530" y="114" width="152" height="128" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <circle cx="554" cy="136" r="13" fill="#C2410C"/>
  <text x="554" y="140" text-anchor="middle" class="step-num">4</text>
  <text x="574" y="140" class="step-t">Gemini File API</text>
  <text x="542" y="168" class="step-d">Upload .avi, poll</text>
  <text x="542" y="184" class="step-d">ACTIVE, run 7-pillar</text>
  <text x="542" y="200" class="step-d">JSON prompt</text>
  <text x="542" y="222" class="step-d" style="fill:#9A3412;">Dual memory output</text>

  <line x1="682" y1="178" x2="702" y2="178" stroke="#0060AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="706" y="114" width="142" height="128" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <circle cx="730" cy="136" r="13" fill="#15803D"/>
  <text x="730" y="140" text-anchor="middle" class="step-num">5</text>
  <text x="750" y="140" class="step-t">Drive Backup</text>
  <text x="718" y="168" class="step-d">Uploads .avi + JSON</text>
  <text x="718" y="184" class="step-d">metadata into</text>
  <text x="718" y="200" class="step-d">/SAGE/YYYY-MM-DD/</text>
  <text x="718" y="222" class="step-d" style="fill:#15803D;">User Google Drive</text>

  <line x1="848" y1="178" x2="868" y2="178" stroke="#0060AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6 -->
  <rect x="872" y="114" width="256" height="128" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8"/>
  <circle cx="896" cy="136" r="13" fill="#15803D"/>
  <text x="896" y="140" text-anchor="middle" class="step-num">6</text>
  <text x="916" y="140" class="step-t">Confirm &amp; Index Memory</text>
  <text x="884" y="168" class="step-d">• Temp .avi deleted ONLY if Drive</text>
  <text x="884" y="184" class="step-d">  upload returns success (else retry)</text>
  <text x="884" y="200" class="step-d">• Memory JSON persisted locally</text>
  <text x="884" y="222" class="pill">Zero-Loss Transactional Invariant</text>

  <!-- PIPELINE B: CONVERSATIONAL RAG & RECALL -->
  <text x="32" y="284" class="sec">2. HYBRID RAG &amp; CONVERSATIONAL RECALL FLOW (RECALL AGENT)</text>

  <rect x="32" y="302" width="186" height="114" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="328" class="step-t">A. Voice / Text Query</text>
  <text x="48" y="348" class="step-d">Typed prompt, mic STT,</text>
  <text x="48" y="364" class="step-d">or image/PDF/DOCX</text>
  <text x="48" y="380" class="step-d">chat attachments</text>
  <text x="48" y="402" class="step-d" style="fill:#0369A1;">AttachmentService</text>

  <line x1="218" y1="359" x2="246" y2="359" stroke="#1E293B" stroke-width="2" marker-end="url(#arrDark)"/>

  <rect x="250" y="302" width="234" height="114" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="266" y="328" class="step-t">B. Hybrid Context Retrieval</text>
  <text x="266" y="348" class="step-d">Token-overlap ranking across:</text>
  <text x="266" y="364" class="step-d">Profile Facts, Active Projects,</text>
  <text x="266" y="380" class="step-d">Past Sessions, Doc Chunks (12k cap)</text>
  <text x="266" y="402" class="step-d" style="fill:#0369A1;">+ Recorded Video Summaries</text>

  <line x1="484" y1="359" x2="512" y2="359" stroke="#1E293B" stroke-width="2" marker-end="url(#arrDark)"/>

  <rect x="516" y="302" width="224" height="114" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="532" y="328" class="step-t">C. Intent &amp; Grounded Reply</text>
  <text x="532" y="348" class="step-d">Gemini classifies intent</text>
  <text x="532" y="364" class="step-d">(VIDEO_QUESTION, PROJECT,</text>
  <text x="532" y="380" class="step-d">ATTACHED_FILE, GENERAL) and</text>
  <text x="532" y="402" class="step-d" style="fill:#9A3412;">returns response + matchedVideoId</text>

  <line x1="740" y1="359" x2="768" y2="359" stroke="#1E293B" stroke-width="2" marker-end="url(#arrDark)"/>

  <rect x="772" y="302" width="356" height="114" rx="10" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="788" y="328" class="step-t">D. Evidence Playback &amp; Async Vault Update</text>
  <text x="788" y="348" class="step-d">• Fetches video via Drive stream / local cache</text>
  <text x="788" y="364" class="step-d">• Opens in-app player + transcript + blueprint</text>
  <text x="788" y="380" class="step-d">• Background extraction updates Profile/Project</text>
  <text x="788" y="402" class="pill">Syncs vault to Google Drive appDataFolder</text>

  <!-- Footer legend -->
  <rect x="32" y="440" width="1096" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="50" y="463" class="step-t">Planned Scalability Upgrade (Phase 2):</text>
  <text x="50" y="481" class="step-d">Video summaries currently use SharedPreferences and prompt-context injection; large multi-month archives will migrate to SQLite + local/cloud vector embeddings.</text>
</svg>

