<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="SAGE 4-Tier System Architecture">
  <defs>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .tier-tag { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #FFFFFF; }
      .card-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .box-title { font: 700 12.5px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .box-text { font: 400 11.5px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .badge-text { font: 600 10.5px 'Segoe UI', Arial, sans-serif; fill: #0369A1; }
      .link-label { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #1E3A8A; }
      .footer-note { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0060AA"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#15803D"/>
    </marker>
  </defs>

  <!-- White Canvas -->
  <rect width="1180" height="560" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="32" y="40" class="title">SAGE — Four-Tier Implemented System Architecture</text>
  <text x="32" y="62" class="subtitle">Edge hardware capture, native Android link &amp; AVI synchronization, multimodal Gemini enrichment, and user-owned cloud recall</text>
  <line x1="32" y1="76" x2="1148" y2="76" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- TIER 1: WEARABLE -->
  <rect x="32" y="96" width="248" height="360" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="32" y="96" width="248" height="32" rx="12" fill="#0060AA"/>
  <rect x="32" y="114" width="248" height="14" fill="#0060AA"/>
  <text x="48" y="117" class="tier-tag">TIER 1 · WEARABLE EDGE</text>
  <text x="48" y="152" class="card-title">XIAO ESP32-S3 Sense</text>

  <rect x="46" y="168" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="58" y="187" class="box-title">Core 1 · HTTP Control (:80)</text>
  <text x="58" y="205" class="box-text">• OV2640 VGA (640x480) JPEG</text>
  <text x="58" y="222" class="box-text">• /live_frame, /health, /status</text>

  <rect x="46" y="252" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="58" y="271" class="box-title">Core 0 · FreeRTOS Audio (:81)</text>
  <text x="58" y="289" class="box-text">• I2S PDM Mic (16 kHz, 16-bit)</text>
  <text x="58" y="306" class="box-text">• 8x gain + clipping guard, TCP</text>

  <rect x="46" y="336" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="58" y="355" class="box-title">Local Wi-Fi SoftAP</text>
  <text x="58" y="373" class="box-text">• SSID: SAGE-XIAO (ch 6)</text>
  <text x="58" y="389" class="box-text">• 45s heartbeat watchdog</text>

  <rect x="46" y="410" width="220" height="28" rx="14" fill="#E0F2FE"/>
  <text x="156" y="428" text-anchor="middle" class="badge-text">Firmware v3.0.0 · No Cloud Needed</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="280" y1="276" x2="318" y2="276" stroke="#0060AA" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="299" y="262" text-anchor="middle" class="link-label">Wi-Fi</text>
  <text x="299" y="294" text-anchor="middle" class="box-text">AP</text>

  <!-- TIER 2: ANDROID CLIENT -->
  <rect x="324" y="96" width="268" height="360" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="324" y="96" width="268" height="32" rx="12" fill="#1E3A8A"/>
  <rect x="324" y="114" width="268" height="14" fill="#1E3A8A"/>
  <text x="340" y="117" class="tier-tag">TIER 2 · MOBILE CLIENT (ANDROID)</text>
  <text x="340" y="152" class="card-title">Flutter + Kotlin Native</text>

  <rect x="338" y="168" width="240" height="76" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="350" y="187" class="box-title">Kotlin Network Bridge</text>
  <text x="350" y="205" class="box-text">• WifiNetworkSpecifier + socket bind</text>
  <text x="350" y="222" class="box-text">• Prevents cellular routing leaks</text>

  <rect x="338" y="256" width="240" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="350" y="275" class="box-title">Streaming RIFF/AVI Muxer</text>
  <text x="350" y="293" class="box-text">• Interleaves 00dc + 01wb + idx1</text>
  <text x="350" y="310" class="box-text">• Post-hoc header drift fix (&lt;40ms)</text>
  <text x="350" y="327" class="box-text">• Local cache (/Download/SAGE)</text>

  <rect x="338" y="350" width="240" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="350" y="369" class="box-title">Android Keystore (AES-256-GCM)</text>
  <text x="350" y="387" class="box-text">• Hardware-backed BYOK API Key</text>

  <rect x="338" y="412" width="240" height="28" rx="14" fill="#E0F2FE"/>
  <text x="458" y="430" text-anchor="middle" class="badge-text">4 Tabs: Memories · Capture · Recall · You</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="592" y1="276" x2="630" y2="276" stroke="#0060AA" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="611" y="262" text-anchor="middle" class="link-label">HTTPS</text>
  <text x="611" y="294" text-anchor="middle" class="box-text">Async</text>

  <!-- TIER 3: AI & MEMORY -->
  <rect x="636" y="96" width="252" height="360" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="636" y="96" width="252" height="32" rx="12" fill="#C2410C"/>
  <rect x="636" y="114" width="252" height="14" fill="#C2410C"/>
  <text x="652" y="117" class="tier-tag">TIER 3 · MULTIMODAL AI &amp; RAG</text>
  <text x="652" y="152" class="card-title">Gemini + Memory Vault</text>

  <rect x="650" y="168" width="224" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="662" y="187" class="box-title">Gemini Multimodal File API</text>
  <text x="662" y="205" class="box-text">• 7-pillar scene + audio prompt</text>
  <text x="662" y="222" class="box-text">• Dual output: human_memory +</text>
  <text x="662" y="238" class="box-text">  reconstruction_blueprint JSON</text>

  <rect x="650" y="262" width="224" height="76" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="662" y="281" class="box-title">Multi-Model Resilience</text>
  <text x="662" y="299" class="box-text">• Fallback chain + 429/503 backoff</text>
  <text x="662" y="316" class="box-text">• Key passed via x-goog-api-key</text>

  <rect x="650" y="350" width="224" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="662" y="369" class="box-title">Hybrid RAG Memory Store</text>
  <text x="662" y="387" class="box-text">• Profile, Projects, Docs (12k budget)</text>

  <rect x="650" y="412" width="224" height="28" rx="14" fill="#FFEDD5"/>
  <text x="762" y="430" text-anchor="middle" style="font: 600 10.5px 'Segoe UI', Arial, sans-serif; fill: #9A3412;">Planned: Vector Embeddings &amp; SQLite</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="888" y1="276" x2="926" y2="276" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="907" y="262" text-anchor="middle" style="font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #15803D;">OAuth</text>
  <text x="907" y="294" text-anchor="middle" class="box-text">Sync</text>

  <!-- TIER 4: CLOUD & RECALL -->
  <rect x="932" y="96" width="216" height="360" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="932" y="96" width="216" height="32" rx="12" fill="#15803D"/>
  <rect x="932" y="114" width="216" height="14" fill="#15803D"/>
  <text x="948" y="117" class="tier-tag">TIER 4 · CLOUD &amp; RECALL</text>
  <text x="948" y="152" class="card-title">Drive &amp; Evidence UI</text>

  <rect x="946" y="168" width="188" height="84" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="958" y="187" class="box-title">Google Drive API v3</text>
  <text x="958" y="205" class="box-text">• Scopes: drive.file + appdata</text>
  <text x="958" y="222" class="box-text">• /SAGE/YYYY-MM-DD/*.avi</text>
  <text x="958" y="239" class="box-text">• Tombstone vault merge</text>

  <rect x="946" y="264" width="188" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="958" y="283" class="box-title">Conversational Recall</text>
  <text x="958" y="301" class="box-text">• Voice (STT) or text query</text>
  <text x="958" y="318" class="box-text">• Returns answer + video ID</text>

  <rect x="946" y="348" width="188" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="958" y="367" class="box-title">Ground-Truth Playback</text>
  <text x="958" y="385" class="box-text">• In-app media_kit AVI player</text>

  <rect x="946" y="412" width="188" height="28" rx="14" fill="#DCFCE7"/>
  <text x="1040" y="430" text-anchor="middle" style="font: 600 10.5px 'Segoe UI', Arial, sans-serif; fill: #166534;">User-Owned Zero-Vendor Cloud</text>

  <!-- Safety Invariant Strip -->
  <rect x="32" y="476" width="1116" height="56" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="52" y="500" class="footer-note">Architectural Invariants Verified in Codebase:</text>
  <text x="52" y="520" class="box-text">1. Local-First Capture: Nothing leaves the wearable until the user's Android device connects.   2. Transactional Cleanup: Local .avi deleted ONLY after confirmed Drive upload.   3. Key Custody: API keys live in Android Keystore.</text>
</svg>

